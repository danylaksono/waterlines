  <text x="540" y="815" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#203647">Masalah algoritmik</text>

  <text x="240" y="875" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#2f6f7e">1. Offset garis</text>
  <text x="240" y="910" font-family="Inter, Arial, sans-serif" font-size="20" fill="#4f5964">Garis-garis diposisikan sejauh jarak tertentu dari pantai.</text>

  <text x="240" y="980" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#2f6f7e">2. Bertemu dan berpotongan</text>
  <text x="240" y="1015" font-family="Inter, Arial, sans-serif" font-size="20" fill="#4f5964">Di pulau, selat, dan lekukan, jalur dapat saling menumpuk.</text>

  <text x="240" y="1085" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#2f6f7e">3. Menjadi terlalu rapat</text>
  <text x="240" y="1120" font-family="Inter, Arial, sans-serif" font-size="20" fill="#4f5964">Solusinya bukan sekadar menggambar ulang, melainkan algoritma.</text>

