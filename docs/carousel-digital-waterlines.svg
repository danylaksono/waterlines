<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">Illustration for a carousel slide on digital waterlines</title>
  <desc id="desc">A coastal map illustration showing offset waterlines around a shoreline and a modern digital challenge with overlapping lines at islands and straits.</desc>

  <rect width="1080" height="1350" fill="#f6efe6"/>

  <text x="540" y="120" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="54" font-weight="700" fill="#203647">Digital waterlines</text>
  <text x="540" y="170" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" fill="#5d6b74">From hand-drawn coastal lines to algorithmic geometry</text>

