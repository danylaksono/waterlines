<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=&apos;http://www.w3.org/2000/svg&apos; viewBox=&apos;0 0 32 32&apos;%3E%3Crect width=&apos;32&apos; height=&apos;32&apos; fill=&apos;%23cfdcd8&apos;/%3E%3Cg fill=&apos;none&apos; stroke=&apos;%236a5138&apos; stroke-width=&apos;1.3&apos;%3E%3Ccircle cx=&apos;16&apos; cy=&apos;16&apos; r=&apos;4&apos;/%3E%3Ccircle cx=&apos;16&apos; cy=&apos;16&apos; r=&apos;7.5&apos;/%3E%3Ccircle cx=&apos;16&apos; cy=&apos;16&apos; r=&apos;11&apos;/%3E%3C/g%3E%3Ccircle cx=&apos;16&apos; cy=&apos;16&apos; r=&apos;2.4&apos; fill=&apos;%23efe4c8&apos;/%3E%3C/svg%3E">
  <title>Waterlines - Nusantara (MapLibre)</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <div id="map"></div>
    <div id="grain"></div>
    <div id="vignette"></div>

    <section id="panel">
      <header>
        <h1>Waterlines over Nusantara</h1>
        <p class="sub">
          Engraved-chart ripples drawn on a 2D canvas above a live MapLibre map.
          Technique after
          <a href="https://observablehq.com/@oliviafvane/ii-drawing-waterlines-on-maps"
             target="_blank" rel="noopener">Olivia Vane</a>.
        </p>
        <p id="region-note"></p>
        <p id="basemap-note"></p>
      </header>
      <div id="panel-body"></div>
    </section>

    <aside id="hud">
      <h2>Frame budget</h2>
      <div id="hud-body"></div>
    </aside>

    <div id="loading">Loading coastlines&hellip;</div>
  </div>

  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
