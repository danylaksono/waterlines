<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=&apos;http://www.w3.org/2000/svg&apos; viewBox=&apos;0 0 32 32&apos;%3E%3Crect width=&apos;32&apos; height=&apos;32&apos; fill=&apos;%23cfdcd8&apos;/%3E%3Cg fill=&apos;none&apos; stroke=&apos;%236a5138&apos; stroke-width=&apos;1.3&apos;%3E%3Ccircle cx=&apos;16&apos; cy=&apos;16&apos; r=&apos;4&apos;/%3E%3Ccircle cx=&apos;16&apos; cy=&apos;16&apos; r=&apos;7.5&apos;/%3E%3Ccircle cx=&apos;16&apos; cy=&apos;16&apos; r=&apos;11&apos;/%3E%3C/g%3E%3Ccircle cx=&apos;16&apos; cy=&apos;16&apos; r=&apos;2.4&apos; fill=&apos;%23efe4c8&apos;/%3E%3C/svg%3E">
  <title>Waterlines - Nusantara (deck.gl)</title>
  <style>
    :root { --ink:#3a3128; --soft:#6b5c48; --paper:#f4ecd8; --rule:#c9b894; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #cfdcd8;
      font: 13px/1.5 ui-sans-serif, system-ui, "Segoe UI", sans-serif; color: var(--ink); }
    #deck-container { position: absolute; inset: 0; overflow: hidden; }
    #deck-container canvas { display: block; }
    #note {
      position: absolute; top: 14px; left: 14px; z-index: 5; max-width: 320px;
      padding: 12px 14px; background: var(--paper);
      border: 1px solid var(--rule); border-radius: 3px;
      box-shadow: 0 10px 28px rgba(30,22,10,.28);
    }
    #note h1 { margin: 0 0 4px; font: 600 15px/1.2 ui-serif, Georgia, serif; }
    #note p { margin: 0; font-size: 11.5px; color: var(--soft); }
    #readout { margin-top: 8px !important; font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; }
    a { color: #6a5138; }
    #loading { position: absolute; inset: 0; z-index: 9; display: grid; place-items: center;
      background: #2c2a26; color: #cdbfa0; }
  </style>
</head>
<body>
  <div id="deck-container"></div>

  <section id="note">
    <h1>Waterlines over deck.gl</h1>
    <p>
      Same engine as the <a href="indonesia-maplibre.html">MapLibre example</a>; the transform
      comes from a deck.gl viewport instead. Drag to pan, scroll to zoom,
      ctrl-drag to rotate.
    </p>
    <p id="readout">&nbsp;</p>
  </section>

  <div id="loading">Loading coastlines&hellip;</div>

  <script src="https://unpkg.com/deck.gl@9.1.14/dist.min.js"></script>
  <script type="module" src="js/deck-app.js"></script>
</body>
</html>
